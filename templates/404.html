<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
          line-height: 1.2;
          margin: 0;
        }

        html {
          color: #888;
          display: table;
          font-family: sans-serif;
          height: 100%;
          text-align: center;
          width: 100%;
        }

        body {
          display: table-cell;
          vertical-align: middle;
          margin: 2em auto;
        }

        h1 {
          color: #555;
          font-size: 2em;
          font-weight: 400;
        }

        p {
          margin: 0 auto;
          width: 280px;
        }

        @media only screen and (max-width: 280px) {

          body,
          p {
            width: 95%;
          }

          h1 {
            font-size: 1.5em;
            margin: 0 0 0.3em;
          }

        }
    </style>
</head>

<body>
<h1>Вариант не найден</h1>
<p>Похоже такого варианта не существует. Попросите создателя прислать вам новый ключ.</p>

<div class="card-footer text-center bg-white">
    <a href="/" class="btn btn-outline-secondary btn-sm">
        Вернуться на главную
    </a>
</div>
</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
